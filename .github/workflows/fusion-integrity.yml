name: Fusion Integrity

on:
  push:
    branches:
      - fusion/phase1-implementation
  pull_request:
    branches:
      - fusion/phase1-implementation

jobs:
  fusion-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy scipy pytest torch
      - name: Run Fusion integrity tests
        run: python -m pytest -q tests/test_fusion_integrity.py
